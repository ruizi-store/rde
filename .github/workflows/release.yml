name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-image:
    # Docker 唯一交付形态：多架构镜像（amd64/arm64）
    # buildx 的 load 只支持单平台镜像 → 按架构 matrix 各建一份 tar
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # arm64 由 QEMU 模拟构建（前端/Go 构建耗时较长但可接受）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            rde:${{ steps.ver.outputs.version }}

      - name: Export image tarball
        run: |
          mkdir -p outputs
          docker save rde:${{ steps.ver.outputs.version }} -o outputs/rde-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.tar
          gzip outputs/*.tar
          ls -lh outputs/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rde-image-${{ matrix.arch }}
          path: outputs/*.tar.gz

  release:
    needs: [build-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          path: outputs
          pattern: rde-image-*
          merge-multiple: true

      - name: Verify artifacts
        run: |
          ls -lh outputs/
          # 两架构的镜像 tar 必须齐（排除 buildx .dockerbuild 调试产物）
          count=$(find outputs -name '*.tar.gz' | wc -l)
          [ "$count" = "2" ] || { echo "expected 2 image tarballs, got $count"; ls -l outputs; exit 1; }

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cat <<'EOF' > release_notes.md
          ## What's New

          See [CHANGELOG](https://github.com/${{ github.repository }}/blob/master/docs/CHANGELOG.md) for details.

          ## Install（Docker 唯一交付形态）

          ```bash
          # 镜像 tar 离线导入（按 CPU 架构选 amd64 / arm64）
          docker load -i rde-*-amd64.tar.gz
          cd docker && docker compose up -d
          # 浏览器访问 http://<服务器IP>:3080 直接进入桌面（默认免登录）
          ```
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RDE ${{ steps.notes.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: outputs/*.tar.gz
