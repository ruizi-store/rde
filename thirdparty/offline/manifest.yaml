# RDE 离线资源清单
# 安装后位于 /usr/share/rde/offline/manifest.yaml
# 配置项 offline.dir 可覆盖根目录（默认 /usr/share/rde/offline）
#
# fulliso 构建会把真实 tar 合并进 images/、models/，并覆盖本清单。
# 准备示例：
#   docker pull redroid/redroid:14.0.0-latest
#   docker save -o images/redroid_redroid_14.0.0-latest.tar redroid/redroid:14.0.0-latest
#   # LibreTranslate en/zh Argos 包 → models/libretranslate-en-zh.tar
#   #（内容为挂载到 /home/libretranslate/.local 下的 share/argos-translate/...）

version: "1"

images:
  redroid/redroid:14.0.0-latest: images/redroid_redroid_14.0.0-latest.tar
  libretranslate/libretranslate:latest: images/libretranslate_libretranslate_latest.tar

models:
  libretranslate-en-zh: models/libretranslate-en-zh.tar

debs: {}

drivers: {}
