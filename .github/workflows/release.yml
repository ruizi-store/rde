name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Docker 唯一交付形态：多架构镜像（amd64/arm64），
      # arm64 由 QEMU 模拟构建（前端/Go 构建耗时较长但可接受）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          load: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            rde:${{ steps.ver.outputs.version }}
            rde:latest

      - name: Export image tarballs
        run: |
          mkdir -p outputs
          docker save rde:${{ steps.ver.outputs.version }} -o outputs/rde-${{ steps.ver.outputs.version }}-amd64.tar
          gzip outputs/*.tar
          ls -lh outputs/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rde-image
          path: outputs/*.tar.gz

  release:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: outputs
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cat <<'EOF' > release_notes.md
          ## What's New

          See [CHANGELOG](https://github.com/${{ github.repository }}/blob/master/docs/CHANGELOG.md) for details.

          ## Install（Docker 唯一交付形态）

          ```bash
          # 镜像 tar 离线导入
          docker load -i rde-*-amd64.tar.gz
          cd docker && docker compose up -d
          # 浏览器访问 http://<服务器IP>:3080 直接进入桌面（默认免登录）
          ```
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RDE ${{ steps.notes.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: outputs/*.tar.gz
