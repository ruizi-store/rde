# RDE 容器化部署示例
#
# 用法:
#   cd docker && docker compose up -d
#   浏览器访问 http://<服务器IP>:3080 直接进入桌面（默认免登录，无需注册）
#
# 安全提示:
#   挂载 /var/run/docker.sock 等于赋予容器宿主机 root 级权限（可创建特权容器）。
#   默认免登录模式（RDE_AUTH_MODE=none）适合内网/反向代理之后的自托管场景；
#   需要账号体系时把 RDE_AUTH_MODE 改为 local（安装向导 + 登录恢复）。
#   面向公网部署时请置于反向代理 + TLS 之后。

services:
  rde:
    image: rde:latest          # 或 registry.example.com/ruizi/rde:latest
    build: ..
    container_name: rde
    restart: unless-stopped
    ports:
      - "3080:3080"            # 宿主机端口改动只改左侧；容器内端口用 RDE_PORT
    environment:
      TZ: Asia/Shanghai
      RDE_PORT: "3080"
      # ---- 认证模式：none=免登录单用户（默认）；local=账号登录（向导+密码）----
      RDE_AUTH_MODE: none
      # ---- 模块开关（可选模块仅 ssh/sync/cloudbackup；两项都留空 = 启用全部）----
      RDE_MODULES_DISABLED: ""
    volumes:
      # 数据目录：两侧路径必须一致（docker-apps 生成的 bind mount 按宿主机路径解析）
      - /var/lib/rde:/var/lib/rde
      # Docker API（Docker 应用商店 / bot 工作台容器）
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rde-bot-net             # Bot 沙箱网络（控制面直连沙箱串流）
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- 可选：模型服务（本地推理）----
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   volumes:
  #     - /var/lib/rde/ollama:/root/.ollama
  #   # GPU: deploy.resources.reservations.devices 或 nvidia-container-toolkit

# Bot 沙箱网络（RDE 容器与 bot 工作台容器同网段，控制面直连 KasmVNC 串流）
# bot 模块首次创建沙箱时也会自动创建该网络
networks:
  rde-bot-net:
    name: rde-bot-net
    driver: bridge
