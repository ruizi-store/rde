# RDE 离线资源清单
# 安装后位于 /usr/share/rde/offline/manifest.yaml
# 配置项 offline.dir 可覆盖根目录（默认 /usr/share/rde/offline）
#
# 准备示例：
#   docker pull redroid/redroid:14.0.0-latest
#   docker save -o images/redroid_redroid_14.0.0-latest.tar redroid/redroid:14.0.0-latest

version: "1"

images:
  redroid/redroid:14.0.0-latest: images/redroid_redroid_14.0.0-latest.tar
  tinylab/linux-lab: images/tinylab_linux-lab.tar

debs: {}

drivers: {}
